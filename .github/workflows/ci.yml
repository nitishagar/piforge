name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: rust

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --lib --tests
      - name: Test (hw feature, pure-logic + ABI)
        # Compiles the hw path (a second compile gate beyond cross-compile) and
        # runs the no-hardware-needed hw tests: the gpio_v2 ABI size-assertions
        # and the edge_label/since_us/bus_num_from_path/resolve_chip decoders.
        # Scope capture boundedness stays a manual Pi gate (off-Pi-untestable).
        run: cargo test --features hw --lib --tests
      - name: Build (eval binary)
        run: cargo build --release --bin piforge-eval
      - name: Mock eval parity check
        run: |
          set -o pipefail
          ./target/release/piforge-eval --mock --config ../piforge.toml.example --cases ../eval/cases | tee /tmp/out.txt
          grep -q "DECISION: BUILD_LOCAL" /tmp/out.txt

  # Cross-compile the real hw binary to the Pi 5 target.
  cross-compile-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Install cross linker
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build piforge (hw feature, arm64)
        working-directory: rust
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --features hw --target aarch64-unknown-linux-gnu --bin piforge
      - name: Verify ELF
        run: file target/aarch64-unknown-linux-gnu/release/piforge
