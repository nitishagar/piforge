name: Rust CI

on:
  push:
    branches: [main, rust-rewrite]
  pull_request:

defaults:
  run:
    working-directory: rust

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Install Linux hw deps (i2c-tools)
        run: sudo apt-get update && sudo apt-get install -y i2c-tools
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true # warnings-as-errors can wait; surface for now
      - name: Test
        run: cargo test --lib --tests
      - name: Build (eval binary)
        run: cargo build --release --bin piforge-eval
      - name: Mock eval parity check
        run: |
          ./target/release/piforge-eval --mock --config Cargo.toml --cases ../eval/cases | tee /tmp/out.txt
          grep -q "DECISION: PIVOT_TO_CLOUD" /tmp/out.txt

  # Cross-compile the real hw binary to the Pi 5 target.
  cross-compile-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Install cross linker
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build piforge (hw feature, arm64)
        working-directory: rust
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --features hw --target aarch64-unknown-linux-gnu --bin piforge
      - name: Verify ELF
        run: file target/aarch64-unknown-linux-gnu/release/piforge
