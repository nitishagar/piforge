[package]
name = "piforge"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
description = "The agent that understands live hardware state — a coding harness for Raspberry Pi 5"
publish = false

[lib]
name = "piforge"
path = "src/lib.rs"

[[bin]]
name = "piforge"
path = "src/bin/piforge.rs"

[[bin]]
name = "piforge-eval"
path = "src/bin/piforge_eval.rs"

[dependencies]
# Async runtime + HTTP client (talks to local llama-server OpenAI-compat endpoint).
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "fs", "process"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Config + CLI + errors.
toml = "1.1"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
async-trait = "0.1"
# Mutex without poisoning — a panicked tool thread must not cascade-kill the
# whole agent loop (std Mutex poisons on panic; parking_lot does not).
parking_lot = "0.12"
# GPIO character device (pure Rust, no libgpiod C dep). Linux-only; guarded.
gpiod = { version = "0.3", optional = true }
# I2C via linux-embedded-hal (pure Rust ioctl). Linux-only; guarded.
linux-embedded-hal = { version = "0.4", optional = true }

[features]
# Hardware access compiles only on Linux (mirrors the Go build-tag split).
# Default on linux; off elsewhere (dev/test on macOS).
default = []
hw = ["dep:gpiod", "dep:linux-embedded-hal"]

# Release profile: small + stripped (the "one small static binary" goal).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
# For unit tests of the broker/sim/eval logic + the scope-jitter benchmark.
tokio = { version = "1.53", features = ["test-util"] }
criterion = { version = "0.5", default-features = false, features = ["plotters", "cargo_bench_support"] }

[[bench]]
name = "jitter"
harness = false
